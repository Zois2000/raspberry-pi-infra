---
- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: false

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Set default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Remove obolete MQTT rule for Windows hotspot
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "192.168.137.0/24"
    to_port: "1884"
    delete: true

- name: Allow MQTT from IoT network
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ firewall_mqtt_source_network }}"
    to_ip: "{{ firewall_mqtt_destination_ip }}"
    to_port: "{{ firewall_mqtt_port }}"
  when: firewall_manage_mqtt_legacy

- name: Remove legacy MQTT access from IoT network
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ firewall_mqtt_source_network }}"
    to_ip: "{{ firewall_mqtt_destination_ip }}"
    to_port: "{{ firewall_mqtt_legacy_port }}"
    delete: true
  when: not firewall_manage_mqtt_legacy

- name: Allow MQTT over TLS from IoT network
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ firewall_mqtt_source_network }}"
    to_ip: "{{ firewall_mqtt_destination_ip }}"
    to_port: "{{ firewall_mqtt_tls_port }}"
  when: firewall_manage_mqtt_legacy

- name: Ensure UFW is enabled
  community.general.ufw:
    state: enabled
